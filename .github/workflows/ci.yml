name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # mediapipe (backend/requirements.txt) dong goi libmediapipe.so lien ket
      # toi libEGL/libGLESv2/libOpenCL (dong packages do hoa/GPU) - khong co
      # san tren runner ubuntu-latest (may ao CI thuan, khong co card do hoa).
      # Thieu may thu vien nay thi "import mediapipe" bao ImportError ngay
      # luc nap module, truoc khi pytest kip chay bat ky test nao - xac nhan
      # bang cach tai wheel manylinux that ve soi chuoi ky tu trong file .so.
      - name: Install system libraries for mediapipe (EGL/GLES/OpenCL)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 ocl-icd-libopencl1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
        env:
          # Tests run against an in-memory SQLite DB (see tests/conftest.py) —
          # no real MySQL/.env needed. SECRET_KEY only has to be non-empty for
          # Settings() to construct.
          SECRET_KEY: ci-test-secret-key

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos: this repo has ~39 pre-existing info-level lints
        # (documented in CLAUDE.md as known/non-blocking); errors and
        # warnings still fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
